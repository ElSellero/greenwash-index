name: live-ingest
on:
  schedule:
    # Off-peak minutes (not :00) on purpose: GitHub drops scheduled runs at the
    # top-of-hour peak, so :07/:22/:37/:52 lands more reliably than */15 would.
    # ~15-min target, but GitHub throttling makes it best-effort (~30–60 min in
    # practice) — see CONFIG.live.intervalMinutes. The guaranteed daily news
    # scan is the Vercel cron /api/ingest/news (vercel.json), not this.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tick:
    runs-on: ubuntu-latest
    # the curl already caps itself at 110s; this just stops a wedged job from
    # sitting on a runner for the default 6h
    timeout-minutes: 5
    steps:
      - name: Trigger live ingest
        run: |
          curl -fsS -X POST "${{ secrets.APP_URL }}/api/ingest/live" \
            -H "Authorization: Bearer ${{ secrets.INGEST_SECRET }}" \
            --max-time 110
