name: backfill
on:
  schedule:
    # Daily recent-news catch-up (last 89 days); shares a DB lease/cursor with
    # the bounded Vercel morning scan. Resume safely after failures.
    - cron: '0 10 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  # never let two backfill passes race on the shared DB / Gemini quota
  group: backfill
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Catch up recent news
        run: npm run backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
